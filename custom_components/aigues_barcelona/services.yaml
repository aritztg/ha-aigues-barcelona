---
# Service call documentation for Aigues de Barcelona integration

reset_and_refresh_data:
  name: Reset and Refresh Data
  description: >-
    WARNING! Re-reads the meter history from the water company and rewrites the
    stored statistics, querying one week at a time. Defaults to the last two
    years.
  fields:
    days:
      name: Days
      description: >-
        How far back to go. The company appears to keep around three years,
        and weeks it has no data for are skipped, so overshooting is harmless
        beyond the extra requests.
      required: false
      default: 730
      example: 1095
      selector:
        number:
          min: 7
          max: 3650
          step: 1
          unit_of_measurement: days
          mode: box
