---
default_install_hook_types:
- pre-commit
- commit-msg
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-docstring-first
  - id: check-json
  - id: pretty-format-json
    args: [--autofix, --no-sort-keys]
  - id: check-yaml
  - id: check-toml
  - id: check-added-large-files
  - id: check-merge-conflict
  - id: debug-statements
# Replaces black, flake8, pyupgrade, isort and docformatter, which used to be
# five hooks here. Keep the rev in step with the ruff pinned in pyproject.toml.
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.8
  hooks:
  - id: ruff-check
    args: [--fix]
  - id: ruff-format
