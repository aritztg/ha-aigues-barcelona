---
name: Test

on:
  push:
    branches:
    - main
  pull_request:

jobs:
  validate:
    name: Valid integration
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: HACS
      # hacs/action has not cut a release since 2022, so @main is what HACS
      # documents and what actually gets maintained.
      uses: hacs/action@main
      with:
        category: integration
    - name: Home Assistant hassfest
      uses: home-assistant/actions/hassfest@master

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v10
      with:
        enable-cache: true
    - run: uv sync --group dev
    - name: ruff check
      run: uv run ruff check --output-format=github .
    - name: ruff format
      run: uv run ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v10
      with:
        enable-cache: true
    - run: uv sync --group dev
    - name: pytest
      run: uv run pytest --cov=custom_components --cov-report=term-missing
